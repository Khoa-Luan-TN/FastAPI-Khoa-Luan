services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: letuandat_backend
    ports:
      - "8100:8000"
    env_file: app/core/config.env
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-changeme}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-data-edu}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-changeme}
      PG_NAME: ${PG_NAME:-data-edu}
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: ${MONGODB_DB:-Metadata-Edu}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeme}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3040,https://ers.etechs.vn}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
      auto-restore:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── Frontend (React/Vite → nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_OIDC_ISSUER: ${VITE_OIDC_ISSUER:-https://api.etechs.vn}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-ers-fe}
        VITE_OIDC_REDIRECT_URI: ${VITE_OIDC_REDIRECT_URI:-https://ers.etechs.vn/auth/callback}
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${VITE_OIDC_POST_LOGOUT_REDIRECT_URI:-https://ers.etechs.vn}
        VITE_OIDC_SCOPE: ${VITE_OIDC_SCOPE:-openid profile email}
    container_name: letuandat_frontend
    ports:
      - "3040:80"
    depends_on:
      - backend
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: letuandat_cloudflared
    profiles: [tunnel]
    depends_on:
      - frontend
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg18
    container_name: letuandat_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: ${PG_NAME:-data-edu}
    ports:
      - "5434:5432"
    volumes:
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:4.4.29
    container_name: letuandat_mongodb
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "(mongosh --quiet --eval \"db.adminCommand('ping').ok\" || mongo --quiet --eval \"db.adminCommand('ping').ok\") | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:2025.11.2-enterprise
    container_name: letuandat_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    ports:
      - "18474:7474"
      - "18687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: letuandat_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Auto-restore (runs once on startup; skips silently when AUTO_RESTORE≠true) ─
  # Set AUTO_RESTORE=true in .env to automatically restore databases after
  # postgres / mongodb / minio are healthy.  Neo4j cannot be auto-restored
  # (requires offline load) — restore it manually after startup.
  #
  # Requires Docker socket access to call docker exec / docker cp on running
  # service containers.  The service always exits 0 so backend is not blocked
  # if a restore fails.
  auto-restore:
    image: docker:cli
    container_name: letuandat_auto_restore
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      AUTO_RESTORE: ${AUTO_RESTORE:-true}
      NEO4J_AUTO_RESTORE: ${NEO4J_AUTO_RESTORE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker:/project/docker:ro
      - ./database:/project/database:ro
    entrypoint: >
      /bin/sh -c "
      if [ \"$${AUTO_RESTORE:-false}\" != 'true' ]; then
        echo '[auto-restore] Skipped (AUTO_RESTORE != true). Set AUTO_RESTORE=true in .env to enable.';
        exit 0;
      fi;
      echo '[auto-restore] AUTO_RESTORE=true — installing bash...';
      apk add --no-cache bash >/dev/null 2>&1 || true;
      echo '[auto-restore] Running restore-all.sh...';
      bash /project/docker/restore-all.sh || true;
      echo '[auto-restore] Done.';
      exit 0
      "

  # ── MinIO bucket initializer (runs once, exits after bucket is created) ────
  minio-init:
    image: minio/mc
    container_name: letuandat_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-changeme} &&
      (
        mc ls local/$${MINIO_BUCKET:-data-edu} >/dev/null 2>&1 ||
        mc mb --ignore-existing local/$${MINIO_BUCKET:-data-edu} >/dev/null 2>&1 ||
        true
      ) &&
      echo 'MinIO bucket $${MINIO_BUCKET:-data-edu} is ready.'
      "
    restart: "no"

  # ── Restore services (profile: restore) ───────────────────────────────────
  # These services do NOT run during normal `docker compose up`.
  #
  # Usage (after placing backups in database/):
  #   docker compose --profile restore run --rm restore-postgres
  #   docker compose --profile restore run --rm restore-mongo
  #   docker compose --profile restore run --rm restore-minio
  #
  #   # Neo4j requires the neo4j service to be stopped first:
  #   docker compose stop neo4j
  #   docker compose --profile restore run --rm restore-neo4j
  #   docker compose start neo4j

  restore-postgres:
    image: pgvector/pgvector:pg18
    profiles: [restore]
    container_name: letuandat_restore_postgres
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_backup:/backup:ro
    entrypoint: >
      /bin/sh -c "
      if [ -f /backup/backup.dump ]; then
        echo '[restore-postgres] Restoring from backup.dump (custom format)...' &&
        PGPASSWORD=$${PG_PASSWORD:-changeme} pg_restore -h postgres -U $${PG_USER:-postgres} --clean --if-exists -d $${PG_NAME:-data-edu} /backup/backup.dump &&
        echo 'SUCCESS: PostgreSQL restored.';
      elif [ -f /backup/backup.sql ]; then
        echo '[restore-postgres] Restoring from backup.sql (plain SQL)...' &&
        PGPASSWORD=$${PG_PASSWORD:-changeme} psql -h postgres -U $${PG_USER:-postgres} -d $${PG_NAME:-data-edu} -f /backup/backup.sql &&
        echo 'SUCCESS: PostgreSQL restored.';
      else
        echo 'ERROR: No backup file found in /backup (expected backup.dump or backup.sql).' && exit 1;
      fi
      "
    restart: "no"

  restore-mongo:
    image: mongo:4.4.29
    profiles: [restore]
    container_name: letuandat_restore_mongo
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_mongo:/backup:ro
    entrypoint: >
      /bin/bash -c "
      DB=$${MONGODB_DB:-Metadata-Edu};
      if find /backup -maxdepth 2 -name '*.json' | grep -q .; then
        echo '[restore-mongo] JSON export layout -> /backup' &&
        for file in /backup/*.json; do
          [ -f $$file ] || continue;
          base=$$(basename $$file .json);
          collection=$${base#$$DB.};
          if [ "$$collection" = "$$base" ]; then collection=$$base; fi;
          if grep -Eq '^[[:space:]]*\\[[[:space:]]*\\][[:space:]]*$$' $$file; then
            echo '[restore-mongo] Skipping empty array file -> '$$(basename $$file) &&
            mongo --host mongodb $$DB --quiet --eval \"db.getCollection('$$collection').drop()\" >/dev/null 2>&1 || true;
            continue;
          fi;
          echo '[restore-mongo] Importing collection -> '$$collection &&
          mongo --host mongodb $$DB --quiet --eval \"db.getCollection('$$collection').drop()\" >/dev/null 2>&1 || true;
          mongoimport --host mongodb --db $$DB --collection $$collection --file $$file --jsonArray ||
          mongoimport --host mongodb --db $$DB --collection $$collection --file $$file;
        done &&
        echo 'SUCCESS: MongoDB restored.';
      elif [ -d /backup/$$DB ]; then
        echo '[restore-mongo] Standard layout -> /backup/'$$DB &&
        mongorestore --host mongodb --drop --db $$DB /backup/$$DB;
      else
        echo '[restore-mongo] Flat layout -> /backup' &&
        mongorestore --host mongodb --drop --db $$DB /backup;
      fi && echo 'SUCCESS: MongoDB restored.'
      "
    restart: "no"

  restore-neo4j:
    # NOTE: Stop the neo4j service before running this restore:
    #   docker compose stop neo4j
    #   docker compose --profile restore run --rm restore-neo4j
    #   docker compose start neo4j
    image: neo4j:2025.11.2-enterprise
    profiles: [restore]
    container_name: letuandat_restore_neo4j
    volumes:
      - neo4j_data:/data
      - ./database/stem_kg_neo4j:/backups:ro
    environment:
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    entrypoint: >
      /bin/bash -c "
      DB=$${NEO4J_DATABASE:-neo4j};
      DUMP=/backups/$$DB.dump;
      if [ ! -f $$DUMP ]; then
        alt_dump=$$(find /backups -maxdepth 1 -name '*.dump' | head -n 1);
        if [ -n "$$alt_dump" ]; then
          DUMP=$$alt_dump;
        else
          echo 'ERROR: dump not found: '$$DUMP && exit 1;
        fi;
      fi;
      echo '[restore-neo4j] Loading '$$DB' from '$$DUMP'...' &&
      neo4j-admin database load --from-path=/backups --overwrite-destination=true $$DB &&
      echo 'SUCCESS: Neo4j restored.'
      "
    restart: "no"

  restore-minio:
    image: minio/mc
    profiles: [restore]
    container_name: letuandat_restore_minio
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_minio:/backup:ro
    entrypoint: >
      /bin/sh -c "
      BUCKET=$${MINIO_BUCKET:-data-edu};
      ACCESS=$${MINIO_ACCESS_KEY:-minioadmin};
      SECRET=$${MINIO_SECRET_KEY:-changeme};
      TARBALL=/backup/minio-data.tar.gz;
      TMPDIR=/tmp/minio_restore;
      SRC='';
      if [ -d /backup/$$BUCKET ]; then
        echo '[restore-minio] Backup layout: object tree';
        SRC=/backup/$$BUCKET;
        MODE=object-tree;
      elif [ -d /backup/minio-data ]; then
        echo '[restore-minio] Backup layout: full MinIO data directory';
        SRC=/backup/minio-data;
        MODE=full-data-dir;
      elif [ -f $$TARBALL ]; then
        echo '[restore-minio] Backup layout: compressed archive — extracting...';
        mkdir -p $$TMPDIR &&
        tar -xzf $$TARBALL -C $$TMPDIR;
        if [ -d $$TMPDIR/$$BUCKET ]; then
          SRC=$$TMPDIR/$$BUCKET;
          MODE=object-tree;
        elif [ -d $$TMPDIR/minio-data ]; then
          SRC=$$TMPDIR/minio-data;
          MODE=full-data-dir;
        else
          echo 'ERROR: bucket dir not found in archive (expected: '$$BUCKET'/ or minio-data/).';
          echo 'Archive top-level:'; ls $$TMPDIR 2>/dev/null || true;
          rm -rf $$TMPDIR; exit 1;
        fi;
      else
        echo 'ERROR: No backup found in /backup/';
        echo '  Expected: /backup/'$$BUCKET'/  (extracted object tree)';
        echo '  Or:       /backup/minio-data.tar.gz  (compressed archive)';
        exit 1;
      fi;
      if [ "$$MODE" = 'full-data-dir' ]; then
        echo '[restore-minio] Full data-dir restore is not supported inside the restore container.' &&
        echo '[restore-minio] Use: bash docker/import-minio.sh' &&
        exit 1;
      fi;
      mc alias set local http://minio:9000 $$ACCESS $$SECRET &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc mirror --overwrite $$SRC local/$$BUCKET &&
      echo 'SUCCESS: MinIO bucket '$$BUCKET' restored.';
      rm -rf $$TMPDIR 2>/dev/null || true
      "
    restart: "no"

volumes:
  pg18_data:
  mongo_data:
  neo4j_data:
  minio_data:
