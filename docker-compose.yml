services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stem_kg_backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend (React/Vite → nginx) ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: stem_kg_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stem_kg_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-changeme}
      POSTGRES_DB: ${PG_NAME:-data-edu}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MongoDB ────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: stem_kg_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5
    container_name: stem_kg_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── MinIO ──────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: stem_kg_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-changeme}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── MinIO bucket initializer (runs once, exits after bucket is created) ────
  minio-init:
    image: minio/mc
    container_name: stem_kg_minio_init
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-changeme} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET:-data-edu} &&
      echo 'MinIO bucket $${MINIO_BUCKET:-data-edu} is ready.'
      "
    restart: "no"

  # ── Restore services (profile: restore) ───────────────────────────────────
  # These services do NOT run during normal `docker compose up`.
  #
  # Usage (after placing backups in database/):
  #   docker compose --profile restore run --rm restore-postgres
  #   docker compose --profile restore run --rm restore-mongo
  #   docker compose --profile restore run --rm restore-minio
  #
  #   # Neo4j requires the neo4j service to be stopped first:
  #   docker compose stop neo4j
  #   docker compose --profile restore run --rm restore-neo4j
  #   docker compose start neo4j

  restore-postgres:
    image: postgres:16-alpine
    profiles: [restore]
    container_name: stem_kg_restore_postgres
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_backup:/backup:ro
    entrypoint: >
      /bin/sh -c "
      if [ -f /backup/backup.dump ]; then
        echo '[restore-postgres] Restoring from backup.dump (custom format)...' &&
        PGPASSWORD=$${PG_PASSWORD:-changeme} pg_restore -h postgres -U $${PG_USER:-postgres} --clean --if-exists -d $${PG_NAME:-data-edu} /backup/backup.dump &&
        echo 'SUCCESS: PostgreSQL restored.';
      elif [ -f /backup/backup.sql ]; then
        echo '[restore-postgres] Restoring from backup.sql (plain SQL)...' &&
        PGPASSWORD=$${PG_PASSWORD:-changeme} psql -h postgres -U $${PG_USER:-postgres} -d $${PG_NAME:-data-edu} -f /backup/backup.sql &&
        echo 'SUCCESS: PostgreSQL restored.';
      else
        echo 'ERROR: No backup file found in /backup (expected backup.dump or backup.sql).' && exit 1;
      fi
      "
    restart: "no"

  restore-mongo:
    image: mongo:7
    profiles: [restore]
    container_name: stem_kg_restore_mongo
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_mongo:/backup:ro
    entrypoint: >
      /bin/bash -c "
      DB=$${MONGODB_DB:-Metadata-Edu};
      if [ -d /backup/$$DB ]; then
        echo '[restore-mongo] Standard layout -> /backup/'$$DB &&
        mongorestore --host mongodb --drop --db $$DB /backup/$$DB;
      else
        echo '[restore-mongo] Flat layout -> /backup' &&
        mongorestore --host mongodb --drop --db $$DB /backup;
      fi && echo 'SUCCESS: MongoDB restored.'
      "
    restart: "no"

  restore-neo4j:
    # NOTE: Stop the neo4j service before running this restore:
    #   docker compose stop neo4j
    #   docker compose --profile restore run --rm restore-neo4j
    #   docker compose start neo4j
    image: neo4j:5
    profiles: [restore]
    container_name: stem_kg_restore_neo4j
    volumes:
      - neo4j_data:/data
      - ./database/stem_kg_neo4j:/backups:ro
    environment:
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    entrypoint: >
      /bin/bash -c "
      DB=$${NEO4J_DATABASE:-neo4j};
      DUMP=/backups/$$DB.dump;
      if [ ! -f $$DUMP ]; then
        echo 'ERROR: dump not found: '$$DUMP && exit 1;
      fi;
      echo '[restore-neo4j] Loading '$$DB' from '$$DUMP'...' &&
      neo4j-admin database load --from-path=/backups --overwrite-destination=true $$DB &&
      echo 'SUCCESS: Neo4j restored.'
      "
    restart: "no"

  restore-minio:
    image: minio/mc
    profiles: [restore]
    container_name: stem_kg_restore_minio
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./database/stem_kg_minio:/backup:ro
    entrypoint: >
      /bin/sh -c "
      BUCKET=$${MINIO_BUCKET:-data-edu};
      ACCESS=$${MINIO_ACCESS_KEY:-minioadmin};
      SECRET=$${MINIO_SECRET_KEY:-changeme};
      if [ ! -d /backup/$$BUCKET ]; then
        echo 'ERROR: bucket directory not found: /backup/'$$BUCKET && exit 1;
      fi;
      mc alias set local http://minio:9000 $$ACCESS $$SECRET &&
      mc mb --ignore-existing local/$$BUCKET &&
      mc mirror --overwrite /backup/$$BUCKET local/$$BUCKET &&
      echo 'SUCCESS: MinIO bucket '$$BUCKET' restored.'
      "
    restart: "no"

volumes:
  pg_data:
  mongo_data:
  neo4j_data:
  minio_data:
